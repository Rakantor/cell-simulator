<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested Cells</title>
<style>
  :root {
    --ui-bg: rgba(18, 10, 28, 0.42);
    --ui-bg-hover: rgba(18, 10, 28, 0.72);
    --ui-fg: rgba(255, 240, 252, 0.86);
    --ui-dim: rgba(255, 240, 252, 0.5);
    --ui-line: rgba(255, 255, 255, 0.12);
    --ui-on: rgba(255, 255, 255, 0.2);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1c0620;
    color: var(--ui-fg);
    font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior: none;
  }
  #view {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #view:active { cursor: grabbing; }

  #helpbar {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px 5px 14px;
    border-radius: 999px;
    background: var(--ui-bg);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    white-space: nowrap;
    user-select: none;
    transition: background-color 0.2s ease;
    max-width: calc(100vw - 32px);
    overflow: hidden;
  }
  #helpbar:hover { background: var(--ui-bg-hover); }
  .hb-sep { color: var(--ui-dim); }
  .seg {
    display: inline-flex;
    margin-left: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    padding: 2px;
  }
  .seg button {
    font: inherit;
    color: var(--ui-dim);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 2px 10px;
    cursor: pointer;
  }
  .seg button.on { color: var(--ui-fg); background: var(--ui-on); }
  .seg button:focus-visible { outline: 1px solid var(--ui-fg); }

  #message {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--ui-fg);
    text-align: center;
    padding: 0 16px;
  }
  #message[hidden] { display: none; }

  #panel {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 300px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    box-sizing: border-box;
    padding: 10px 12px 12px;
    border-radius: 10px;
    background: rgba(12, 8, 20, 0.8);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--ui-fg);
    overscroll-behavior: contain;
  }
  #panel[hidden] { display: none; }
  .p-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .p-title { font-weight: 600; font-size: 12px; }
  .p-hint { color: var(--ui-dim); }
  .p-stats { white-space: pre-line; color: var(--ui-dim); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .p-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .p-buttons button {
    font: inherit;
    color: var(--ui-fg);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--ui-line);
    border-radius: 5px;
    padding: 3px 7px;
    cursor: pointer;
  }
  .p-buttons button:hover { background: rgba(255, 255, 255, 0.16); }
  .p-group { border-top: 1px solid var(--ui-line); padding-top: 6px; margin-top: 6px; }
  .p-gtitle { color: var(--ui-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .p-row { display: grid; grid-template-columns: 1fr 96px 40px; align-items: center; gap: 6px; }
  .p-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-row input { width: 96px; margin: 2px 0; accent-color: #d9a3ff; }
  .p-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ui-dim); }
  .p-pal summary { cursor: pointer; padding: 2px 0; }
  .p-colors { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px 6px; padding: 4px 0 6px; }
  .p-color { display: flex; align-items: center; gap: 4px; overflow: hidden; }
  .p-color input { width: 20px; height: 16px; padding: 0; border: 0; background: none; }
  .p-color span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ui-dim); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="helpbar"></div>
<div id="panel" hidden></div>
<div id="message" hidden></div>
<script src="js/config.js"></script>
<script src="js/gl.js"></script>
<script src="js/shaders.js"></script>
<script src="js/camera.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
